
# Improved pose estimation experiment configuration
#
# These parameters are experimental engineering choices.
# They are NOT parameters reported in the original paper.

experiment:
  scenario_id: "Approach_L1"
  seed: 42
  duration_seconds: 10.0
  simulation_fps: 50

checkpoints:
  classifier: "checkpoints/pose_classifier_best.pt"
  calibration: "checkpoints/classifier_error_calibration.npz"

improved_particle_filter:
  particle_count: 5000
  resampling_alpha: 0.9

  position_noise_std: 0.5
  rotation_noise_std: 0.01

  measurement_sigma_px: 2.0
  outlier_probability: 0.02

  ess_threshold_ratio: 0.5
  reseed_interval: 10

  particle_sample_limit: 250

geometric_refinement:
  reprojection_threshold_px: 5.0
  ransac_iterations: 200
  confidence: 0.99

  refine: true
  minimum_points: 6

hybrid:
  maximum_geometric_error_px: 4.0
  minimum_geometric_inliers: 6

evaluation:
  compare_methods:
    - "paper_pf"
    - "improved_pf"
    - "geometric"
    - "hybrid"

  report_position_error: true
  report_attitude_error: true
  report_reprojection_error: true
  report_runtime: true
  report_effective_sample_size: true

outputs:
  directory: "outputs/experiments"
